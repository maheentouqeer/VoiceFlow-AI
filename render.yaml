services:
  - type: web
    name: voiceflow-ai
    runtime: python
    plan: free
    buildCommand: 'pip install -r requirements.txt'
    startCommand: python deployment/browser/server.py
    envVars:
      # sync: false is what makes Render prompt for a value during Blueprint
      
      # creation. Everything below with a literal value is set for you and can
      # be changed afterwards under Environment on the service.
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: GITHUB_PAT
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: TODOIST_TOKEN
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_CHANNEL_ID
        sync: false
      # Which agents/<name>.jsonc the service publishes on boot.
      - key: AGENT
        value: ambient
      # Paste an id from your .env here to serve that exact agent. Left empty,
      # the service publishes AGENT itself and reuses the agent of the same
      # name on later restarts.
      - key: AGENT_ID
        value: ''
      # NOTION_TOKEN / NOTION_PARENT_PAGE_ID intentionally not listed here:
      # the Notion path spawns `npx`, which needs Node available in the
      # runtime. Render's plain Python runtime does not include it, so the
      # Notion stretch goal needs a different runtime (e.g. Docker) to deploy
      # - it still works fine locally where you have Node installed already.
